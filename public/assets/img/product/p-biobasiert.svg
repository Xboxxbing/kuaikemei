<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ec"/><stop offset="1" stop-color="#d7e8d3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".08"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="520" cy="70" r="120" fill="#fff" opacity=".28"/>
  <circle cx="70" cy="400" r="90" fill="#fff" opacity=".22"/>
  
  <g filter="url(#sh)" transform="translate(300 245)">
    <path d="M-118 -110 L118 -110 L100 130 L-100 130 Z" fill="#3f7d3a"/>
    <path d="M-118 -110 L118 -110 L100 130 L-100 130 Z" fill="url(#gloss)"/>
    <ellipse cx="0" cy="-110" rx="118" ry="30" fill="#2d5c2a"/>
    <ellipse cx="0" cy="-110" rx="118" ry="30" fill="url(#gloss)"/>
    <ellipse cx="0" cy="-112" rx="94" ry="22" fill="#3f7d3a" opacity=".55"/>
    <path d="M-118 -100 Q0 40 100 -100" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6"/>
    <rect x="-72" y="-36" width="144" height="96" rx="8" fill="#fff" opacity=".94"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold" fill="#2d5c2a">BIO</text>
    <text x="0" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#8a8f96">3kg/桶（A+B）</text>
    <text x="0" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#2d5c2a">BIOBASIERT</text>
  </g>
  <text x="300" y="418" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6d7278">BIOBASIERT 生物基氢化美缝剂</text>
